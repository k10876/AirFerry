name: android-scanner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/scanner/**'
      - 'core/**'
      - '.github/workflows/android-scanner.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Assemble scanner debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (API 34, NDK, CMake)
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Write apps/scanner/local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > apps/scanner/local.properties
          echo "sdk.dir written:" && cat apps/scanner/local.properties

      - name: Install Rust stable + cargo-ndk + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Export NDK for cargo-ndk / Gradle
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        working-directory: apps/scanner
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airferry-scanner-debug
          path: apps/scanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
